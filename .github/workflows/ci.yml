name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      IOS_SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0

    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - run: just ci
